name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests use fake models, so the heavy ML packages are not needed here.
      - run: pip install fastapi httpx numpy python-dotenv pytest pytest-asyncio uvicorn
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/js/vad.test.js
