<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Voice assistant architecture: STT to LLM to TTS</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15212c"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#f6f8fa"/>

  <!-- Browser lane -->
  <rect x="20" y="20" width="960" height="130" rx="10" fill="#e8edf1" stroke="#cbd5dd"/>
  <text x="40" y="46" font-size="15" font-weight="600" fill="#15212c">Browser  (HTML + JavaScript, AudioWorklet)</text>

  <rect x="40" y="70" width="170" height="60" rx="6" fill="#fff" stroke="#8a98a5"/>
  <text x="125" y="97" font-size="14" font-weight="600" text-anchor="middle" fill="#15212c">Microphone</text>
  <text x="125" y="116" font-size="11.5" text-anchor="middle" fill="#5b6b79">echo cancellation on</text>

  <rect x="260" y="70" width="210" height="60" rx="6" fill="#fff" stroke="#8a98a5"/>
  <text x="365" y="97" font-size="14" font-weight="600" text-anchor="middle" fill="#15212c">Stage-1 VAD</text>
  <text x="365" y="116" font-size="11.5" text-anchor="middle" fill="#5b6b79">adaptive gate, pre-roll, hang-over</text>

  <rect x="520" y="70" width="200" height="60" rx="6" fill="#fff" stroke="#b3261e"/>
  <text x="620" y="97" font-size="14" font-weight="600" text-anchor="middle" fill="#15212c">Barge-in</text>
  <text x="620" y="116" font-size="11.5" text-anchor="middle" fill="#5b6b79">stop audio, report ms heard</text>

  <rect x="770" y="70" width="190" height="60" rx="6" fill="#fff" stroke="#8a98a5"/>
  <text x="865" y="97" font-size="14" font-weight="600" text-anchor="middle" fill="#15212c">Gapless player</text>
  <text x="865" y="116" font-size="11.5" text-anchor="middle" fill="#5b6b79">Web Audio sentence queue</text>

  <line x1="210" y1="100" x2="258" y2="100" stroke="#15212c" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="470" y1="100" x2="518" y2="100" stroke="#15212c" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Server lane -->
  <rect x="20" y="215" width="960" height="235" rx="10" fill="#e8edf1" stroke="#cbd5dd"/>
  <text x="40" y="241" font-size="15" font-weight="600" fill="#15212c">Server  (Python, FastAPI + asyncio, everything local)</text>

  <rect x="40" y="275" width="190" height="85" rx="6" fill="#fff" stroke="#2845f5" stroke-width="2.4"/>
  <text x="135" y="304" font-size="15" font-weight="700" text-anchor="middle" fill="#2845f5">1  Speech to text</text>
  <text x="135" y="326" font-size="12" text-anchor="middle" fill="#15212c">faster-whisper</text>
  <text x="135" y="344" font-size="11.5" text-anchor="middle" fill="#5b6b79">Silero VAD (stage 2), en / hi</text>

  <rect x="290" y="275" width="190" height="85" rx="6" fill="#fff" stroke="#0f7b6c" stroke-width="2.4"/>
  <text x="385" y="304" font-size="15" font-weight="700" text-anchor="middle" fill="#0f7b6c">2  Language model</text>
  <text x="385" y="326" font-size="12" text-anchor="middle" fill="#15212c">Ollama, Gemma 3 4B</text>
  <text x="385" y="344" font-size="11.5" text-anchor="middle" fill="#5b6b79">token streaming</text>

  <rect x="540" y="275" width="180" height="85" rx="6" fill="#fff" stroke="#8a98a5" stroke-width="1.6"/>
  <text x="630" y="304" font-size="14" font-weight="600" text-anchor="middle" fill="#15212c">Sentence chunker</text>
  <text x="630" y="326" font-size="11.5" text-anchor="middle" fill="#5b6b79">cut at sentence end</text>
  <text x="630" y="344" font-size="11.5" text-anchor="middle" fill="#5b6b79">or first comma; LLM keeps going</text>

  <rect x="780" y="275" width="180" height="85" rx="6" fill="#fff" stroke="#e8960c" stroke-width="2.4"/>
  <text x="870" y="304" font-size="15" font-weight="700" text-anchor="middle" fill="#8a5200">3  Text to speech</text>
  <text x="870" y="326" font-size="12" text-anchor="middle" fill="#15212c">Piper</text>
  <text x="870" y="344" font-size="11.5" text-anchor="middle" fill="#5b6b79">English + Hindi voices</text>

  <line x1="230" y1="317" x2="288" y2="317" stroke="#15212c" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="480" y1="317" x2="538" y2="317" stroke="#15212c" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="720" y1="317" x2="778" y2="317" stroke="#15212c" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="260" y="388" width="250" height="44" rx="6" fill="#fff" stroke="#8a98a5" stroke-dasharray="4 3"/>
  <text x="385" y="408" font-size="12.5" font-weight="600" text-anchor="middle" fill="#15212c">Conversation memory</text>
  <text x="385" y="424" font-size="11" text-anchor="middle" fill="#5b6b79">rolling history, trimmed to what was heard</text>
  <line x1="385" y1="388" x2="385" y2="362" stroke="#15212c" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- cross-lane flows -->
  <path d="M365 130 V190 H135 V273" fill="none" stroke="#15212c" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="250" y="184" font-size="11.5" text-anchor="middle" fill="#15212c">utterance, 16 kHz PCM over WebSocket</text>

  <path d="M870 273 V132" fill="none" stroke="#15212c" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="858" y="195" font-size="11.5" text-anchor="end" fill="#15212c">PCM per sentence,</text>
  <text x="858" y="210" font-size="11.5" text-anchor="end" fill="#15212c">plus transcript + timings</text>

  <path d="M620 130 V170 H500 V273" fill="none" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrd)"/>
  <text x="508" y="196" font-size="11.5" fill="#b3261e">interrupt: cancels LLM + TTS</text>
</svg>
